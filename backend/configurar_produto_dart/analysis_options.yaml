# Análise estática do serviço Configurar_Produto.
#
# Parte do conjunto "recommended" do pacote lints e acrescenta as opções da
# seção 2.5 da apostila Back End com Dart. Para conferir: `dart analyze`.

include: package:lints/recommended.yaml

analyzer:
  language:
    # Proíbe conversões implícitas de dynamic (ex.: atribuir um valor vindo do
    # JSON a uma variável String sem checar o tipo).
    strict-casts: true
    # Exige o tipo genérico explícito (ex.: List<Produto>, e não só List).
    strict-raw-types: true

linter:
  rules:
    # Variáveis locais que não mudam devem ser final.
    - prefer_final_locals
    # Em servidor, use stdout/stderr ou um logger em vez de print.
    - avoid_print
    # Toda função e método declara o tipo de retorno.
    - always_declare_return_types
    # Future não aguardado precisa ser intencional (await ou unawaited).
    - unawaited_futures
