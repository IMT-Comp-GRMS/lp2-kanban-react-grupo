apiVersion: apps/v1
kind: Deployment
metadata:
  name: historico-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historico
  template:
    metadata:
      labels:
        app: historico
    spec:
      containers:
        - name: historico
          image: historico
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: HOST
              value: mysql-service
            - name: USERBD
              value: root
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE
              value: BD_Historico
---
apiVersion: v1
kind: Service
metadata:
  name: historico-service
spec:
  selector:
    app: historico
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
