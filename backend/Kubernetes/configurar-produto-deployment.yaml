apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurar-produto-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configurar-produto
  template:
    metadata:
      labels:
        app: configurar-produto
    spec:
      containers:
        - name: configurar-produto
          image: configurar-produto-dart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          # Nomes de variável lidos pelo AppConfig (lib/src/config/app_config.dart)
          env:
            - name: APP_ENV
              value: production
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: BD_Produtos
---
apiVersion: v1
kind: Service
metadata:
  name: configurar-produto-service
spec:
  selector:
    app: configurar-produto
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      # porta fixa de acesso externo: http://localhost:30001
      nodePort: 30001
