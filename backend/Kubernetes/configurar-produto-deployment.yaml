apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurar-produto-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configurar-produto
  template:
    metadata:
      labels:
        app: configurar-produto
    spec:
      containers:
        - name: configurar-produto
          image: configurar-produto
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: HOST
              value: mysql-service
            - name: USERBD
              value: root
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE
              value: BD_Produtos
---
apiVersion: v1
kind: Service
metadata:
  name: configurar-produto-service
spec:
  selector:
    app: configurar-produto
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
