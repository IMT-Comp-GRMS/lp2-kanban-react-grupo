apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurar-produto-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configurar-produto
  template:
    metadata:
      labels:
        app: configurar-produto
    spec:
      containers:
        - name: configurar-produto
          image: configurar-produto-dart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          # Nomes de variável lidos pelo AppConfig (lib/src/config/app_config.dart)
          env:
            - name: APP_ENV
              value: production
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: BD_Produtos
          # Liga as rotas da seção 11.6 da apostila Back End com Dart ao Kubernetes:
          # - liveness: se /health/live falhar, o Kubernetes reinicia o contêiner;
          # - readiness: enquanto /health/ready falhar (ex.: banco fora do ar),
          #   o Pod fica 0/1 e o Service não manda tráfego para ele.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: configurar-produto-service
spec:
  selector:
    app: configurar-produto
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      # porta fixa de acesso externo: http://localhost:30001
      nodePort: 30001
---
# Service interno (ClusterIP), como o lembretes-clusterip-service da seção
# 4.3.72.1 da apostila de Microsserviços: é por ele que o barramento fala com
# este serviço dentro do cluster. O NodePort acima continua para o acesso de fora.
apiVersion: v1
kind: Service
metadata:
  name: configurar-produto-clusterip-service
spec:
  selector:
    app: configurar-produto
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
