apiVersion: apps/v1
kind: Deployment
metadata:
  name: criar-pedido-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: criar-pedido
  template:
    metadata:
      labels:
        app: criar-pedido
    spec:
      containers:
        - name: criar-pedido
          image: criar-pedido
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: mysql-service
            - name: USERBD
              value: root
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE
              value: KanBan
---
apiVersion: v1
kind: Service
metadata:
  name: criar-pedido-service
spec:
  selector:
    app: criar-pedido
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
