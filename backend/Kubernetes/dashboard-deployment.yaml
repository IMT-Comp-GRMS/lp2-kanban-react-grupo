apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: dashboard
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: HOST
              value: mysql-service
            - name: USERBD
              value: root
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE
              value: BD_DashBoard
            # Fuso de Brasília para o new Date() do gráfico de volume diário
            - name: TZ
              value: America/Sao_Paulo
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: dashboard
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
      # porta fixa de acesso externo: http://localhost:30004
      nodePort: 30004
---
# Service interno (ClusterIP), como o lembretes-clusterip-service da seção
# 4.3.72.1 da apostila de Microsserviços: é por ele que o barramento fala com
# este serviço dentro do cluster. O NodePort acima continua para o acesso de fora.
apiVersion: v1
kind: Service
metadata:
  name: dashboard-clusterip-service
spec:
  selector:
    app: dashboard
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
