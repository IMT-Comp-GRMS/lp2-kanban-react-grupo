apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: dashboard
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: HOST
              value: mysql-service
            - name: USERBD
              value: root
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE
              value: BD_DashBoard
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: dashboard
  #Ip externo, acessível fora do cluster
  type: NodePort
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
